<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Syron — Repository Map visual smoke test</title>
  <!-- Same libraries / order as the real app (Phase 132). -->
  <script src="https://unpkg.com/three@0.157.0/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
  <style>
    html,body{margin:0;height:100%;background:#070b14;color:#dce6ff;font-family:Inter,system-ui,sans-serif}
    #graph{position:fixed;inset:0}
    #status{position:fixed;top:12px;left:12px;z-index:10;font:12px ui-monospace,monospace;
      background:rgba(8,12,22,.8);border:1px solid rgba(120,160,255,.25);border-radius:8px;padding:10px 14px;white-space:pre}
    .ok{color:#42f5b0}.fail{color:#ff5c7a}
  </style>
</head>
<body>
  <div id="status">running…</div>
  <div id="graph"></div>
  <script>
  /* Self-contained smoke test of the EXACT node-rendering technique the app uses:
     global THREE + opaque MeshBasicMaterial spheres via nodeThreeObject, sized to
     the spatial spread. Sets window.__SMOKE_RESULT = {pass, ...} and renders a
     PASS/FAIL banner. A human can open /graph_smoke.html and SEE the spheres. */
  (function () {
    const result = { forceGraph: false, three: false, nodes: 0, meshes: 0,
                     minRadius: 0, maxRadius: 0, containerW: 0, containerH: 0, pass: false, reason: "" };
    const statusEl = document.getElementById("status");
    function show() {
      const cls = result.pass ? "ok" : "fail";
      statusEl.className = cls;
      statusEl.textContent =
        (result.pass ? "PASS" : "FAIL") + " — Repository Map node rendering\n" +
        "ForceGraph3D: " + result.forceGraph + "\n" +
        "THREE global: " + result.three + "\n" +
        "container: " + result.containerW + "x" + result.containerH + "\n" +
        "nodes: " + result.nodes + "  meshes: " + result.meshes + "\n" +
        "radius: " + result.minRadius + ".." + result.maxRadius +
        (result.reason ? "\n" + result.reason : "");
      window.__SMOKE_RESULT = result;
    }
    result.forceGraph = typeof ForceGraph3D === "function";
    result.three = typeof THREE === "object";
    if (!result.forceGraph || !result.three) {
      result.reason = "Library/global missing (offline?).";
      return show();
    }
    // Small synthetic graph with importance + galaxy spread.
    const nodes = [];
    for (let i = 0; i < 30; i++) {
      const ang = (i / 30) * Math.PI * 2, r = 120 + (i % 5) * 30;
      nodes.push({
        id: "m" + i,
        fan_in: i % 7 === 0 ? 8 : (i % 3),
        risk_score: i % 9 === 0 ? 70 : i % 4 === 0 ? 40 : 5,
        is_hub: i % 7 === 0,
        in_cycle: i % 11 === 0,
        galaxy_x: Math.cos(ang) * r, galaxy_y: Math.sin(ang) * r, galaxy_z: (i % 6 - 3) * 18,
      });
    }
    const links = [];
    for (let i = 1; i < 30; i++) links.push({ source: "m" + i, target: "m" + (i % 7) });

    const bounds = Math.max(1, ...nodes.map(n => Math.hypot(n.galaxy_x, n.galaxy_y, n.galaxy_z)));
    const minR = Math.max(5, bounds / 34), maxR = Math.max(minR + 4, bounds / 9);
    const imp = n => {
      const c = Math.min(1, Math.log1p((n.fan_in || 0) * 1.6) / Math.log1p(60));
      const rk = Math.min(1, (n.risk_score || 0) / 80);
      let v = 0.55 * c + 0.45 * rk; if (n.is_hub) v = Math.max(v, 0.7);
      return Math.max(0, Math.min(1, v));
    };
    const radius = n => minR + (maxR - minR) * imp(n);
    const colorHex = n => n.in_cycle ? 0x9a7bff : n.risk_score >= 60 ? 0xff5c7a
      : n.risk_score >= 35 ? 0xffc24b : n.is_hub ? 0x3ef0ff : 0x6f93ff;
    nodes.forEach(n => { n.fx = n.galaxy_x; n.fy = n.galaxy_y; n.fz = n.galaxy_z; });

    const host = document.getElementById("graph");
    const fg = ForceGraph3D()(host)
      .graphData({ nodes, links })
      .backgroundColor("#070b14")
      .showNavInfo(false)
      .linkColor(() => "rgba(120,160,255,0.35)")
      .linkWidth(0.5)
      .nodeThreeObject(n => new THREE.Mesh(
        new THREE.SphereGeometry(radius(n), 18, 14),
        new THREE.MeshBasicMaterial({ color: colorHex(n), fog: false })))
      .nodeThreeObjectExtend(false);

    setTimeout(() => {
      const dist = bounds * 1.35 + Math.sqrt(nodes.length) * 6;
      fg.cameraPosition({ x: dist * 0.38, y: dist * 0.26, z: dist * 0.92 }, { x: 0, y: 0, z: 0 }, 0);
      const data = fg.graphData();
      let meshes = 0, mn = 1e9, mx = 0;
      (data.nodes || []).forEach(n => {
        const o = n.__threeObj;
        if (o && o.geometry && o.geometry.parameters && o.geometry.parameters.radius) {
          meshes++; mn = Math.min(mn, o.geometry.parameters.radius); mx = Math.max(mx, o.geometry.parameters.radius);
        }
      });
      result.nodes = nodes.length;
      result.meshes = meshes;
      result.minRadius = Number.isFinite(mn) ? Math.round(mn * 10) / 10 : 0;
      result.maxRadius = Math.round(mx * 10) / 10;
      result.containerW = host.clientWidth;
      result.containerH = host.clientHeight;
      result.pass = meshes === nodes.length && meshes > 0 &&
        result.minRadius >= 3 && result.containerW > 0 && result.containerH > 0;
      if (!result.pass) result.reason = "No visible node meshes (>=3px) rendered.";
      show();
    }, 1400);
    show();
  })();
  </script>
</body>
</html>
