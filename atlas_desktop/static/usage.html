<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your usage | ATLAS</title>
<link rel="stylesheet" href="marketing.css" />
<link rel="stylesheet" href="billing.css" />
</head><body data-billing-page="usage">
<div class="bg-aura"></div>
<header class="mnav"><div class="wrap row"><a class="mlogo" href="landing.html"><span class="mk">A</span> ATLAS</a>
<nav class="mlinks"><a href="index.html">Open App</a><a href="pricing.html">Plans</a></nav></div></header>
<main class="info-page"><div class="wrap info-shell billing-shell">
  <span class="eyebrow"><span class="dot"></span> Your account</span>
  <h1>Usage &amp; plan</h1>
  <p class="muted">Local usage dashboard — metrics from scans and Atlas workflows on this machine. Billing is not enabled yet.</p>
  <div id="planCard"></div>
  <div id="billingStatus" class="status-banner">Loading billing status…</div>
  <h2 class="section-title">This month</h2>
  <div id="usageCards" class="dash-grid" data-render-target="usage-metrics"></div>
  <div id="emptyState" class="empty-state" style="display:none" data-render-target="usage-empty"></div>
  <h2 class="section-title">Current limits</h2>
  <div id="limits" data-render-target="usage-limits"></div>
  <h2 class="section-title">Largest repositories</h2>
  <div id="largestRepos" data-render-target="usage-largest-repos"></div>
  <h2 class="section-title">Recent activity</h2>
  <div id="recentEvents" data-render-target="usage-recent-events"></div>
  <div id="upgrade" data-render-target="usage-upgrade"></div>
  <p class="flag-note" id="flagNote"></p>
</div></main>
<script src="billing.js"></script>
</body></html>
